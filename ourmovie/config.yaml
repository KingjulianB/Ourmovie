name: "Ourmovie"
version: "0.3.2"
slug: "ourmovie"
description: "Regarder des films et séries à deux, à distance, avec chat en direct"
url: "https://github.com/KingjulianB/Ourmovie"
arch:
  - amd64
  - aarch64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open-outline
startup: application
boot: manual
# L'extension navigateur (V2) ne peut pas passer par l'Ingress (token de session lié
# à une instance HA authentifiée, pas prévu pour un client externe) : elle doit
# atteindre l'add-on en direct. On utilise un port nettement moins disputé que 8099
# (cf. OURMOVIE-FIX-LOG.md pour le conflit déjà rencontré sur 8099).
ports:
  8099/tcp: 38099
ports_description:
  8099/tcp: "API + Socket.IO pour l'extension navigateur (et accès direct en secours)"
options: {}
schema: {}
