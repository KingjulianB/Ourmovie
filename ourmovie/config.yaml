name: "Ourmovie"
version: "0.2.0"
slug: "ourmovie"
description: "Regarder des films et séries à deux, à distance, avec chat en direct"
url: "https://github.com/KingjulianB/Ourmovie"
arch:
  - amd64
  - aarch64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open-outline
startup: application
boot: manual
# Port exposé en plus de l'Ingress : accès direct http://<ip-ha>:8099 en secours,
# utile tant que la fiabilité WebSocket via l'Ingress n'est pas confirmée (cf. discrepancies.md).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Accès direct à l'interface Ourmovie (contourne l'Ingress en cas de souci WebSocket)"
options: {}
schema: {}
